[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-auto"
dynamic = ["version"]
description = "Inspect Slurm capacity and generate resource-aware sbatch plans"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.scripts]
sbatch-auto = "slurm_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "slurm_auto.__version__"}
