# All defaults are optional. CLI options override templates, which override defaults.
[sbatch.defaults]
account = "hoge"
partition = "gpu"
time = "24:00:00"
wrap = "sleep infinity"
job_name = "my-job"

[templates.default]
sbatch_args = []

[templates.short]
sbatch_args = ["--time=01:00:00", "--job-name=short-job"]

# A script after -- replaces the global default wrap.
[templates.batch]
sbatch_args = ["--time=01:00:00"]
