name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests without Slurm
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install from Git and check the console script
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/slurm-auto-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/slurm-auto-bin
        run: |
          python -m pip install uv
          uv tool install --python "$(command -v python)" "git+file://${GITHUB_WORKSPACE}@${GITHUB_SHA}"
          "$UV_TOOL_BIN_DIR/sbatch-auto" --help
